services:
  - type: web
    name: kasa-ilaya-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: KASA_DB_HOST
        sync: false
      - key: KASA_DB_PORT
        value: "4000"
      - key: KASA_DB_NAME
        value: kasa_ilaya_resort
      - key: KASA_DB_USER
        sync: false
      - key: KASA_DB_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
