services:
  - type: web
    name: kasa-ilaya-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: KASA_DB_HOST
        sync: false
      - key: KASA_DB_PORT
        value: "4000"
      - key: KASA_DB_NAME
        value: kasa_ilaya_resort
      - key: KASA_DB_USER
        sync: false
      - key: KASA_DB_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: KASA_GOOGLE_CLIENT_ID
        value: 834800627360-tj8514jf4tqk46oodm358bu9thvub21f.apps.googleusercontent.com
      - key: KASA_MAIL_ENABLED
        value: "true"
      - key: KASA_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: KASA_SMTP_PORT
        value: "587"
      - key: KASA_SMTP_USER
        sync: false
      - key: KASA_SMTP_PASS
        sync: false
      - key: KASA_MAIL_FROM_EMAIL
        sync: false
      - key: KASA_MAIL_FROM_NAME
        value: Kasa Ilaya Resort
